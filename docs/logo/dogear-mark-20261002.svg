  <path d="M 884 191
           C 899 193 919 202 938 217
           L 1276 541
           C 1288 553 1298 568 1303 584
           C 1281 563 1245 548 1206 540
           C 1162 531 1115 533 1070 531
           L 1019 529
           C 978 527 948 517 925 495
           C 897 469 884 437 884 395
           Z" fill="url(#de-fold)"/>

  <!-- 10 折角边缘暖色描边 -->
  <path d="M 884 192
           C 885 262 884 329 884 395
           C 884 438 898 469 925 495
           C 949 518 979 528 1019 530
           C 1071 533 1118 531 1160 538
           C 1208 545 1253 559 1283 584
           C 1297 596 1305 611 1307 627" stroke="#FFAA1E" stroke-opacity="0.34" stroke-width="2" fill="none"/>

  <!-- 11 云体与折角交界的柔和暗部 -->
  <path d="M 883 394
           C 883 444 900 477 931 499
           C 954 516 979 526 1017 530
           C 1022 531 1027 531 1032 531
           C 1000 523 975 512 955 496
           C 925 473 910 443 910 402
           L 910 215
           C 900 207 892 199 884 193
           Z" fill="url(#de-crease)" opacity="0.38"/>

  <!-- 12 云顶轮廓微弱柔化 -->
  <path d="M 466 422
           C 486 342 531 275 600 226
           C 665 180 741 174 800 177
           C 834 178 862 184 883 192" stroke="#FF9B1B" stroke-opacity="0.28" stroke-width="2" fill="none"/>
</svg>
