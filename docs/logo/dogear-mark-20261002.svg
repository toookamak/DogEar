<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 146 1157 756" width="1157" height="756" fill="none" role="img" aria-label="DogEar · 折耳书签">
  <!--
    DogEar 品牌标（精细版，2026-10-02 稿）
    来源：外部提供的 1536x1024 原始稿。本文件做了三处工程化处理：
    1) 补回根 <svg> 开标签（原文件只有属性，缺 xmlns 宿主元素）
    2) 裁到实际图形范围：原稿 x 226-1309 / y 172-876，四周留白约 40%，
       改成 viewBox="200 146 1157 756"（各边留 26px 呼吸），换算比例 1.53:1
    3) 删除未使用的 def：filter#softLight（原稿定义但从未引用）、
       clipPath#bodyClip（同样从未被 clip-path 引用）
    保留 7 组渐变的多层叠加，视觉与原稿一致。
  -->
  <defs>
    <linearGradient id="de-body" x1="330" y1="815" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A16"/>
      <stop offset="0.3" stop-color="#FF5A13"/>
      <stop offset="0.62" stop-color="#FF7414"/>
      <stop offset="1" stop-color="#FF8B16"/>
    </linearGradient>
    <radialGradient id="de-body-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(677 350) rotate(74) scale(520 610)">
      <stop offset="0" stop-color="#FF941B" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#FF7615" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF4B13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="de-body-bottom" x1="640" y1="480" x2="640" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7114" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#FF5B12" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF4215" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="de-fold" x1="885" y1="195" x2="1280" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD85A"/>
      <stop offset="0.28" stop-color="#FFC94B"/>
      <stop offset="0.63" stop-color="#FFB52C"/>
      <stop offset="1" stop-color="#FF9517"/>
    </linearGradient>
    <linearGradient id="de-fold-hi" x1="884" y1="190" x2="1020" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE071" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFD45A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFB62B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="de-fold-shadow" x1="969" y1="492" x2="1268" y2="608" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C92C13"/>
      <stop offset="0.42" stop-color="#E03A15"/>
      <stop offset="0.78" stop-color="#F04A13"/>
      <stop offset="1" stop-color="#FF6415"/>
    </linearGradient>
    <linearGradient id="de-crease" x1="906" y1="410" x2="1010" y2="535" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E94716" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#E84714" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E84714" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="de-flap" x1="1040" y1="545" x2="1220" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F24A15"/>
      <stop offset="0.42" stop-color="#FF5D16"/>
      <stop offset="0.75" stop-color="#FF6C17"/>
      <stop offset="1" stop-color="#FF7519"/>
    </linearGradient>
  </defs>

