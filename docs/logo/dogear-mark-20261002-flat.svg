<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 146 1157 756" width="1157" height="756" fill="none" role="img" aria-label="DogEar · 折耳书签">
  <!--
    DogEar 品牌标 · 小尺寸简化版（2026-10-02 稿）
    用途：16-32px 场景（顶栏 22px、登录页 26px、favicon 16px、导航页）。
    精细版 7 组渐变叠 12 个路径，在这个尺寸下会糊成一块橙团，
    所以这里只保留 4 个关键面 + 1 条交界暗部，靠形状而不是明暗读图：
      云体（橙）/ 右侧下垂折页（深橙）/ 折角（黄）/ 交界暗部（红橙）
    去掉：径向高光、底部暖色、折角高光、两道暖色描边、柔和折痕。
    viewBox 与精细版一致，便于两个文件同尺寸对位。
  -->
  <defs>
    <linearGradient id="dfl-body" x1="330" y1="815" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A13"/>
      <stop offset="1" stop-color="#FF8B16"/>
    </linearGradient>
    <linearGradient id="dfl-flap" x1="1040" y1="545" x2="1220" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2480F"/>
      <stop offset="1" stop-color="#FF7520"/>
    </linearGradient>
    <linearGradient id="dfl-fold" x1="885" y1="195" x2="1280" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD85A"/>
      <stop offset="1" stop-color="#FF9E18"/>
    </linearGradient>
    <linearGradient id="dfl-crease" x1="969" y1="492" x2="1268" y2="608" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C92C13"/>
      <stop offset="1" stop-color="#FF6415"/>
    </linearGradient>
  </defs>

  <!-- 云体 -->
  <path d="M 466 422
           C 486 342 531 275 600 226
           C 665 180 741 174 800 177
           C 835 178 862 184 883 192
           L 883 395
           C 883 444 900 477 931 499
           C 954 516 979 526 1017 530
           C 1059 535 1110 531 1160 539
           C 1220 548 1270 568 1294 596
           C 1305 610 1309 630 1307 657
           C 1304 707 1289 759 1261 793
           C 1235 825 1200 835 1171 824
           C 1140 813 1125 780 1113 739
           C 1098 689 1080 636 1051 595
           C 1042 582 1035 574 1027 570
           L 1027 774
           C 1027 832 989 874 923 876
           L 435 876
           C 359 876 303 851 267 810
           C 237 776 226 724 230 663
           C 234 594 262 531 309 482
           C 352 438 405 421 466 422
           Z" fill="url(#dfl-body)"/>

  <!-- 右侧下垂折页（略深，用来和云体分开） -->
  <path d="M 963 489
           C 983 511 1002 526 1029 541
           C 1057 557 1078 585 1095 620
           C 1115 661 1127 713 1141 758
           C 1151 793 1163 817 1187 823
           C 1214 829 1241 812 1261 787
           C 1290 750 1305 701 1307 657
           C 1309 624 1301 600 1283 584
           C 1255 558 1208 545 1159 538
           C 1111 531 1060 535 1018 530
           C 994 527 975 519 963 509
           Z" fill="url(#dfl-flap)"/>

  <!-- 折角与云体的交界暗部：没有这条，黄色折角会直接贴在橙云体上看不出「折」 -->
  <path d="M 884 394
           C 884 439 898 469 922 494
           C 945 518 976 529 1019 531
           C 1062 534 1110 531 1159 538
           C 1207 545 1254 558 1283 584
           C 1296 596 1304 610 1307 627
           C 1290 600 1260 578 1220 565
           C 1177 551 1125 547 1076 547
           C 1024 547 984 541 954 525
           C 914 503 890 465 884 419
           Z" fill="url(#dfl-crease)"/>

  <!-- 扬起的黄色折角 -->
  <path d="M 884 191
           C 899 193 919 202 938 217
           L 1276 541
           C 1288 553 1298 568 1303 584
           C 1281 563 1245 548 1206 540
           C 1162 531 1115 533 1070 531
           L 1019 529
           C 978 527 948 517 925 495
           C 897 469 884 437 884 395
           Z" fill="url(#dfl-fold)"/>
</svg>
