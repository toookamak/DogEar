<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* 与 DogEar 工作台同一套 Notion 风 × Cloudflare 橙视觉（tokens 见 apps/web/src/styles/tokens.css） */
      :root {
        --canvas: #ffffff;
        --panel: #ffffff;
        --panel-raised: #f7f7f5;
        --line: rgba(55, 53, 47, 0.09);
        --line-strong: #e3e2de;
        --text: #37352f;
        --muted: #787774;
        --faint: #9f9e9b;
        --amber: #f6821f;
        --amber-strong: #e26f0a;
        --amber-soft: rgba(246, 130, 31, 0.13);
        --mint: #448361;
        --mint-soft: rgba(68, 131, 97, 0.14);
        --red: #d44c47;
        --red-soft: rgba(212, 76, 71, 0.12);
        --radius-sm: 4px;
        --radius: 6px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        background: var(--canvas);
        color: var(--text);
        font: 13px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        font-weight: 700;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: linear-gradient(135deg, #f6821f, #e26f0a);
        color: #ffffff;
        font-size: 12px;
      }
      main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .page {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
      }
      .page-title {
        font-weight: 600;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .page-url {
        color: var(--faint);
        font: 10.5px/1.4 ui-monospace, Consolas, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 52px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: rgba(246, 130, 31, 0.45);
        box-shadow: 0 0 0 2px var(--amber-soft);
      }
      .hint { margin: 0; font-size: 11px; color: var(--faint); }
      button.primary {
        padding: 8px 14px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--amber);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary:hover:not(:disabled) { background: var(--amber-strong); }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      button.link {
        padding: 6px 10px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      button.link:hover { color: var(--text); background: var(--panel-raised); }
      .status {
        display: none;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
      }
      .status.ok { display: block; background: var(--mint-soft); color: var(--mint); }
      .status.err { display: block; background: var(--red-soft); color: var(--red); }
      .status a { color: inherit; font-weight: 600; }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      footer .addr {
        color: var(--faint);
        font: 10px/1.4 ui-monospace, Consolas, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }
      footer button {
        border: none;
        background: none;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header><span class="mark">D</span> DogEar · 折耳书签</header>
    <main>
      <div class="page">
        <div class="page-title" id="page-title">读取中…</div>
        <div class="page-url" id="page-url"></div>
      </div>
      <div id="setup" style="display: none">
        <p class="hint">尚未配置 DogEar 地址与 Token。</p>
        <button type="button" class="link" id="go-options">去配置</button>
      </div>
      <div id="form" style="display: none">
        <textarea id="note" placeholder="备注（可选）…"></textarea>
        <button type="button" class="primary" id="save" style="width: 100%">添加书签</button>
      </div>
      <p class="hint" id="error-hint" style="display: none"></p>
      <div class="status" id="status"></div>
    </main>
    <footer>
      <span class="addr" id="addr"></span>
      <button type="button" id="open-options">设置</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
