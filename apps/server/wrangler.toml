# DogEar · Cloudflare Workers（轨 A）部署配置
# 默认部署路径（零 Token）：Cloudflare Workers Builds（面板 Git 集成）自带账号凭据，
#   面板设置 Root directory=apps/server、Deploy command=node scripts/ci-deploy.mjs，
#   脚本一体完成：构建前端 → D1 无则建库 → 回填 database_id（仅构建机工作副本）→
#   迁移 → deploy（API + 前端静态资源同域，见下方 [assets]）。
# 备用路径：.github/workflows/deploy-cloudflare.yml（Actions，需配 API Token）。
# 本地部署：pnpm --filter @dogear/server deploy；本地联调：先 pnpm --filter @dogear/web build
#   再 pnpm --filter @dogear/server dev:workers（用模拟 D1，不需要真实凭据）。
# 详见 docs/modules/20260910_Cloudflare部署.md。

name = "dogear"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# app.ts 使用 node:crypto（会话 HMAC、timingSafeEqual、randomUUID）
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# 前端工作台（apps/web 构建产物）与 API 同域部署：
# /api/*、/health 与 /.well-known/* 先经 Worker 处理（run_worker_first），
# 其余路径由静态资源承接，未命中回退 index.html（SPA fallback）。
# /.well-known/* 是 Agent/扩展的能力发现端点，不先走 Worker 会被 SPA 回退吞成 index.html。
# 本地联调前需先构建前端：pnpm --filter @dogear/web build
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/.well-known/*"]

# 本地与线上统一的真源库绑定，名称必须与 worker.ts 的 Env.DB 一致
[[d1_databases]]
binding = "DB"
database_name = "dogear_prod"
# 占位 id 由 CI 在部署时自动替换为真实库 id（不存在会自动创建 dogear_prod）；
# 本地 dev 用模拟 D1，不校验远端 id，无需手动填写
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/drizzle"

# Cron 触发（轨 A）：每 5 分钟消费 sync_queue，把书签变更推送到已启用的
# Raindrop 通道（消费器见 src/sync/consumer.ts，worker.ts 的 scheduled 接住）。
# 本地 dev 不会触发 cron；自托管（轨 B）由入口 index.ts 的定时器等价承担。
[triggers]
crons = ["*/5 * * * *"]

# 非敏感的普通变量放这里；口令与 Token 用 `wrangler secret put`，不要写进本文件
[vars]
# 工作台来源（工作台与 API 不同域时填写，例如 https://dogear.pages.dev）；
# 留空则按请求 Origin 回显，适合同域部署
# DOGEAR_CORS_ORIGIN = "https://your-workbench.pages.dev"
