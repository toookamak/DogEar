# DogEar · Cloudflare Workers（轨 A）部署配置
# 全自动部署：推送到 GitHub 后由 .github/workflows/deploy-cloudflare.yml 自动完成
# D1 建库（无则自动创建并回填 id）→ 迁移 → 部署 → 口令/Token 同步；
# 用户侧只需配置仓库 Secrets（见 docs/modules/20260910_Cloudflare部署.md）。
# 本地部署仍可用 `pnpm --filter @dogear/server deploy`。
#
# 本地联调（可选）：pnpm --filter @dogear/server dev:workers（用模拟 D1，不需要真实凭据）

name = "dogear"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# app.ts 使用 node:crypto（会话 HMAC、timingSafeEqual、randomUUID）
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# 本地与线上统一的真源库绑定，名称必须与 worker.ts 的 Env.DB 一致
[[d1_databases]]
binding = "DB"
database_name = "dogear_prod"
# 占位 id 由 CI 在部署时自动替换为真实库 id（不存在会自动创建 dogear_prod）；
# 本地 dev 用模拟 D1，不校验远端 id，无需手动填写
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/drizzle"

# 非敏感的普通变量放这里；口令与 Token 用 `wrangler secret put`，不要写进本文件
[vars]
# 工作台来源（工作台与 API 不同域时填写，例如 https://dogear.pages.dev）；
# 留空则按请求 Origin 回显，适合同域部署
# DOGEAR_CORS_ORIGIN = "https://your-workbench.pages.dev"
