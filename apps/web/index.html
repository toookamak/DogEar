<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <meta
      name="description"
      content="DogEar · 折耳书签 — 基于 Raindrop.io 的个人书签增强工具"
    />
    <title>DogEar · 折耳书签</title>
    <script>
      // 主题防闪烁：渲染前读持久化偏好，解析出浅/深挂到 <html data-theme>。
      // 与 src/theme/theme.ts 共用键名 dogear.theme 与两份 theme-color 值，改动需同步。
      ;(function () {
        try {
          var pref = localStorage.getItem('dogear.theme')
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#211e19' : '#faf9f5')
        } catch (e) {
          /* localStorage 不可用时保持浅色，React 启动后由 theme.ts 兜底 */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
