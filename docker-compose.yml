version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DOGEAR_PASSWORD=admin123
      - DOGEAR_DB_PATH=/data/dogear.sqlite
    volumes:
      - dogear-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  dogear-data: